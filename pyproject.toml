[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burmese-ukrainian-phonetic-system"
version = "0.1.0"
description = "Research-grade Burmese graphemic, phonological, phonetic and Ukrainian target correspondence system."
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
