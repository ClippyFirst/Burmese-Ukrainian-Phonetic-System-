name: Optional Burmese Epitran raw-output benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/benchmark_g2p.py"
      - "scripts/benchmark_google_fst.py"
      - "tests/test_benchmark_google_fst.py"
      - "data/burmese/phonology_corpus.csv"
      - "data/burmese/sources.csv"
      - ".github/workflows/optional-epitran-benchmark.yml"
      - "scripts/benchmark_burmese_crf.py"
      - "scripts/prepare_myg2p_probe.py"
      - "tests/test_burmese_crf_benchmark.py"
  pull_request:
    paths:
      - "scripts/benchmark_g2p.py"
      - "data/burmese/phonology_corpus.csv"
      - "data/burmese/sources.csv"
      - ".github/workflows/optional-epitran-benchmark.yml"
      - "scripts/benchmark_burmese_crf.py"
      - "scripts/prepare_myg2p_probe.py"
      - "tests/test_burmese_crf_benchmark.py"

permissions:
  contents: read

jobs:
  raw-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned optional comparator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "epitran==1.35.3"
      - name: Run raw-output benchmark
        run: |
          mkdir -p artifacts
          python scripts/benchmark_g2p.py --engine epitran --output artifacts/burmese-epitran-raw-output.json
      - name: Upload raw-output report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burmese-epitran-raw-output
          path: artifacts/burmese-epitran-raw-output.json*
          if-no-files-found: warn
          retention-days: 90

  crf-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kyaw-yethu/burmese-G2P
          ref: de0f06056cf334b8cdd5a1efd1226f01c8162b77
          path: burmese-g2p
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ye-kyaw-thu/myG2P
          ref: 54b5c76bb5a87fdbaaeddc1892e6ebd8f97ee225
          path: myg2p
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: chokkan/crfsuite
          ref: a2a1547727985e3aff6a35cffe073f57f0223e9d
          path: crfsuite
          persist-credentials: false
      - name: Install pinned CRFsuite build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool liblbfgs-dev
      - name: Build and install pinned CRFsuite CLI
        working-directory: crfsuite
        run: |
          ./autogen.sh
          ./configure
          make -j2
          sudo make install
          sudo ldconfig
          command -v crfsuite
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare deterministic source-attested myG2P probe
        run: |
          mkdir -p artifacts
          python scripts/prepare_myg2p_probe.py \
            --input myg2p/ver2/myg2p.ver2.0.txt \
            --output artifacts/myg2p-v2-probe.csv \
            --summary artifacts/myg2p-v2-probe-summary.json \
            --limit 100
      - name: Run the pinned CRF model as a raw-output diagnostic only
        run: |
          python scripts/benchmark_burmese_crf.py \
            --input artifacts/myg2p-v2-probe.csv \
            --model burmese-g2p/ver2/g2p.model \
            --chunking-script burmese-g2p/crfsuite/chunking.py \
            --crfsuite-example-dir crfsuite/example \
            --crfsuite-bin crfsuite \
            --output artifacts/burmese-crf-raw-output.json
      - name: Upload raw predictions and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burmese-crf-raw-output
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  google-fst-raw-output:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USE_BAZEL_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: google/language-resources
          ref: a90601024f07ab7e96c911243324e0adeb16da96
          path: language-resources
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin legacy Abseil to a Bazel 4-compatible commit
        working-directory: language-resources
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path("WORKSPACE")
          content = workspace.read_text(encoding="utf-8")
          old = '''http_archive(
              name = "com_google_absl",
              strip_prefix = "abseil-cpp-master",
              urls = ["https://github.com/abseil/abseil-cpp/archive/master.zip"],
          )
          '''
          new = '''git_repository(
              name = "com_google_absl",
              commit = "45fdade6c0415ec5af3f9312e6311a4ccc682a7b",
              remote = "https://github.com/abseil/abseil-cpp.git",
          )
          '''
          if old not in content:
              raise SystemExit("Expected unpinned Abseil WORKSPACE block was not found")
          workspace.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Build the pinned Google Burmese Thrax/OpenFst G2P
        working-directory: language-resources
        run: bazel build -c opt //my:g2p
      - name: Check upstream IPA symbol-table invariants
        working-directory: language-resources
        run: |
          bazel test -c opt \
            //my:ipa_phonemes_are_uniquely_decodable \
            //my:phoneme_syms_is_current \
            //my:phoneme_tsv_is_current
      - name: Run raw-output smoke against structural-only probes
        run: |
          mkdir -p artifacts
          python scripts/benchmark_google_fst.py \
            --binary language-resources/bazel-bin/my/g2p \
            --grammar language-resources/my/burmese.grm \
            --phoneme-symbols language-resources/bazel-bin/my/ipa_phoneme.syms \
            --fst language-resources/bazel-bin/my/G2P.fst \
            --bazel-version "$(cd language-resources && bazel --version)" \
            --output artifacts/burmese-google-fst-raw-output.json
      - name: Upload raw outputs and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burmese-google-fst-raw-output
          path: artifacts/burmese-google-fst-raw-output.json*
          if-no-files-found: warn
          retention-days: 90
