name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:built
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed site and runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          grep -q 'id="source"' /tmp/index.html
          grep -q 'type="module"' /tmp/index.html
          grep -q 'src="./vendor/mya2rom/mya2rom.js' /tmp/index.html
          grep -q 'src="./vendor/mya2rom/romanisations.js' /tmp/index.html
          grep -q '<title>' /tmp/system.html
          script_src="$(grep -oE '<script type="module"[^>]*src="[^"]+\\.js"' /tmp/index.html | sed -E 's/.*src="([^"]+)".*/\\1/' | head -n1)"
          css_src="$(grep -oE 'href="[^"]+\\.css"' /tmp/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$script_src" && test -n "$css_src"
          case "$script_src" in http*) script_url="$script_src" ;; /*) script_url="$base$script_src" ;; *) script_url="$base/\${script_src#./}" ;; esac
          case "$css_src" in http*) css_url="$css_src" ;; /*) css_url="$base$css_src" ;; *) css_url="$base/\${css_src#./}" ;; esac
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$script_url" -o /tmp/app.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$css_url" -o /tmp/styles.css
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/vendor/mya2rom/mya2rom.js" -o /tmp/mya2rom.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/vendor/mya2rom/romanisations.js" -o /tmp/romanisations.js
          test -s /tmp/app.js && test -s /tmp/styles.css && test -s /tmp/mya2rom.js && test -s /tmp/romanisations.js
